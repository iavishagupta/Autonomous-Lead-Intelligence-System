email_drafting:
  description: >
    Write a short, clear, personalized follow-up email using the provided lead data.

    Host company profile:
    {host_company}

    Lead data:
    {lead_data}

    Requirements:
      - Mention the lead's role and company
      - Reference their use case or interests
      - Keep tone professional and concise
      - No greetings
      - No sign-offs
      - Keep under 120 tokens

  expected_output: >
    A concise personalized email body under 120 tokens.


engagement_optimization:
  description: >
    Improve the drafted email with:
      - Strong CTA
      - Better engagement hooks
      - Clear value proposition

    Keep it:
      - Direct
      - Professional
      - Under 150 tokens
      - No greetings
      - No closings

    Original draft and lead context will be provided automatically.

  expected_output: >
    An optimized final email under 150 tokens with strong engagement and CTA.
